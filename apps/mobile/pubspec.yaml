name: mindora_mobile
description: "Mindora: Your AI Second Brain mobile application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4
  dio: ^5.4.3+1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0
  record: ^5.1.2
  path_provider: ^2.1.3
  uuid: ^4.4.0
  image_picker: ^1.2.4
  speech_to_text: ^7.5.0
  google_mlkit_text_recognition: ^0.14.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  record_platform_interface: 1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
