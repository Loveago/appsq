services:
  - type: web
    name: mindora-backend
    env: node
    plan: free
    rootDir: apps/backend
    buildCommand: npm run render:build
    startCommand: npm run render:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mindora-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MODELFLARE_API_KEY
        sync: false
      - key: MODELFLARE_BASE_URL
        value: https://api.modelflare.com/v1
      - key: MODELFLARE_MODEL
        value: gpt-4o-mini

databases:
  - name: mindora-postgres
    plan: free
    databaseName: mindora
    user: mindora
