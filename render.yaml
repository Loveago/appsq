services:
  - type: web
    name: mindora-backend
    env: node
    plan: free
    rootDir: apps/backend
    buildCommand: npm run render:build
    startCommand: npm run render:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mindora-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  - type: web
    name: mindora-admin
    env: node
    plan: free
    rootDir: apps/admin
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://mindora-backend-jbxx.onrender.com

databases:
  - name: mindora-postgres
    plan: free
    databaseName: mindora
    user: mindora
